<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · NutriPlan</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f2; color: #292f2b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 320px; padding: 24px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px; background: #244c3a; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #616762; line-height: 1.5; margin: 0 0 20px; }
      button { height: 44px; padding: 0 20px; border: 0; border-radius: 14px; background: #244c3a; color: #fff; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"></div>
      <h1>You're offline</h1>
      <p>Pages you've already opened are still available. Reconnect to load this one.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
